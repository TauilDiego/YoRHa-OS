# F0: lint on every push and pull request, and by hand (workflow_dispatch). Nothing here runs the
# UI; it only reads the sources.
name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    # Arch, like the target system: quickshell and qt6 come from the same repos the users get.
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git shellcheck qt6-declarative qt6-multimedia quickshell

      - uses: actions/checkout@v4

      - name: Trust the checkout
        # The container runs as root over a workspace owned by the runner user.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: shellcheck
        run: |
          # .specify/ is Spec Kit's vendored tooling, not ours. Besides the *.sh, the scripts without
          # an extension (bin/yorha, the boot ones): every tracked file outside .specify/ whose first
          # line is a bash or sh shebang. -x follows the `# shellcheck source=` paths (from the root).
          mapfile -t files < <(git ls-files '*.sh' ':!:.specify/')
          while IFS= read -r f; do
              first=""
              if [[ $f != *.sh && -f $f ]]; then IFS= read -r first < "$f" || true; fi
              if [[ $first =~ ^#!.*[/\ ](ba)?sh(\ |$) ]]; then files+=("$f"); fi
          done < <(git ls-files ':!:.specify/')
          if ((${#files[@]})); then printf '%s\n' "${files[@]}"; shellcheck -x "${files[@]}"; fi
        shell: bash

      - name: qmllint
        # Known Quickshell false positives: its singletons are not declared in qmldir and
        # some of its types are reported as not creatable.
        run: |
          cd shell
          mapfile -t files < <(git ls-files '*.qml')
          /usr/lib/qt6/bin/qmllint "${files[@]}" > ../qmllint.txt 2>&1 || true
          cat ../qmllint.txt
          if grep -E '^(Warning|Error)' ../qmllint.txt \
              | grep -v -E 'not declared as singleton in qmldir|is not creatable'; then
            echo "::error::qmllint found problems"
            exit 1
          fi
        shell: bash
