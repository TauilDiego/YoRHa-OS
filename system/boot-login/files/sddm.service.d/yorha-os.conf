# YoRHa-OS (spec 011): the boot screen stays until the login screen takes over (research R8). Installed
# and removed by yorha-os-boot-login. The handoff script is described in its own header.
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-start.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/share/yorha-os/boot/watch/yorha-boot-handoff
