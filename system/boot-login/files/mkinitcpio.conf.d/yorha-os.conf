# YoRHa-OS boot theme (spec 011): puts the plymouth hook right after kms (or after udev or systemd
# when there is no kms). HOOKS in /etc/mkinitcpio.conf stay as you wrote them; this only adds the
# hook when it is missing. The font needs no FILES: the hook copies the one in the theme's Font=.
# Installed and removed by yorha-os-boot-login.
if [[ " ${HOOKS[*]} " != *" plymouth "* && " ${HOOKS[*]} " != *" sd-plymouth "* ]]; then
    _yorha_hooks=()
    for _yorha_h in "${HOOKS[@]}"; do
        _yorha_hooks+=("$_yorha_h")
        [[ $_yorha_h == kms ]] && _yorha_hooks+=(plymouth)
    done
    if [[ " ${_yorha_hooks[*]} " != *" plymouth "* ]]; then
        _yorha_hooks=()
        for _yorha_h in "${HOOKS[@]}"; do
            _yorha_hooks+=("$_yorha_h")
            [[ $_yorha_h == udev || $_yorha_h == systemd ]] && _yorha_hooks+=(plymouth)
        done
    fi
    HOOKS=("${_yorha_hooks[@]}")
    unset _yorha_hooks _yorha_h
fi
