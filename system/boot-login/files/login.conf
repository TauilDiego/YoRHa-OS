# YoRHa-OS login options (spec 011). This file is yours: the installer writes it once, when it is
# missing, and never changes or removes it. The defaults live in the theme's theme.conf, which
# updates replace. Uncomment a line to change it; the first value of each list is the default.
[General]
# Entrance after boot: full (the band and the glitch), fade or none
#intro=full
# Clock in the middle: big, small or none
#clock=big
# User list: always, or auto (hidden when there is only one user)
#userList=always
# Reduce motion: false, or true (no glitch, tear, breathing or sweeps; the entrance becomes a fade)
#reduceMotion=false
