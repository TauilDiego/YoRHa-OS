# YoRHa-Shell login theme (spec 011). Installed and removed by yorha-shell-boot-login; put your own SDDM
# settings in another file of /etc/sddm.conf.d/. SDDM already starts X with -background none.
# QML_XHR_ALLOW_FILE_READ lets the greeter read /run/yorha-shell/handoff and /proc/uptime (full intro
# right after a boot, a fade otherwise).
# QT_MEDIA_BACKEND (spec 013): the login sounds play through Qt Multimedia's FFmpeg backend. It starts
# faster here than GStreamer (the greeter came up 0.13 s later with GStreamer, 0.03 s with FFmpeg, on
# teste-011). The shell uses GStreamer for its lower latency (shell.qml). Neither backend avoids the
# QSocketNotifier loop, a race in Qt Multimedia 6.12.0 when a sound ends by itself.
[General]
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1,QT_MEDIA_BACKEND=ffmpeg

[Theme]
Current=yorha-shell
