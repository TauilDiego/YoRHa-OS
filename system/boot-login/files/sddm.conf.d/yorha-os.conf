# YoRHa-OS login theme (spec 011). Installed and removed by yorha-os-boot-login; put your own SDDM
# settings in another file of /etc/sddm.conf.d/. SDDM already starts X with -background none.
# QML_XHR_ALLOW_FILE_READ lets the greeter read /run/yorha-os/handoff and /proc/uptime (full intro
# right after a boot, a fade otherwise).
[General]
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1

[Theme]
Current=yorha-os
