# YoRHa-Shell login options (spec 011, FR-031). The first value is the default. Override them in
# /etc/yorha-shell/login.conf (linked as theme.conf.user), never here: updates replace this file.
[General]
# The entry after the boot: full (the band, the name with the glitch, the paper) | fade | none.
# After a logout or a user switch it is always the fade.
intro=full
# The clock in the middle: big | small | none
clock=big
# The user list: always (even with one user) | auto (hidden with one user)
userList=always
# The sounds of the login (the entry, the list, confirm, a wrong password, Reboot and Shut down):
# on | off. They follow the volume and mute left by the last session (spec 013).
sounds=on
# Reduced motion: false | true (no glitch, tear, breathing nor sweeps; the entry fades)
reduceMotion=false
